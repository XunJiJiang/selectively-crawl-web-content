name: Build SCWC runtime releases
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
          - runner: ubuntu-latest
            platform: linux
          - runner: macos-latest
            platform: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '25.x'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run build:core:external-node:${{ matrix.platform }}
      - run: bun run build:core:bundled-node:${{ matrix.platform }}
      - run: bun run test --run projects/server/scripts/release-package.test.ts projects/server/scripts/external-node-runtime.test.ts projects/server/scripts/external-node-distribution.test.ts projects/server/scripts/bundled-node-launch.test.ts projects/server/common/environment.test.ts projects/terminal/plugin/global.test.ts
      # Each build already creates a ZIP with executable modes and dotfiles.
      - uses: actions/upload-artifact@v7
        with:
          name: scwc-runtime-releases-${{ matrix.platform }}
          path: dist/core/scwc-*.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
